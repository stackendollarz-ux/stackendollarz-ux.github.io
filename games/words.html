<html lang="en">

<body>
<title>Stack a Dollar Words</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one screen. Level bar, the puzzle's word slots on the felt, a letter wheel on a wooden board to swipe across, ad banner space at the bottom. Same family look as the other Stack a Dollar games; one dark look by choice. */
:root {
  color-scheme: dark;
  --felt: #5E9E1B; --felt-deep: #3F7A12; --bar: #17240C; --row: #213511; --ink: #FFFFFF; --muted: #D8E8C4;
  --wood: #9A5A2E; --wood-deep: #6E3D1D; --gold: #F4B321; --gold-ink: #2A1B00;
  --tile: #FBF8EE; --tile-edge: #B9AE93; --tile-ink: #18140F;
  --font: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
  --wheel: min(250px, 66vw, 34dvh);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--felt-deep); color: var(--ink); font-family: var(--font); font-size: 1rem; font-weight: 600; display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
button:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px; }

.bar { padding-inline: 16px; padding-block: 8px; background: var(--bar); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 10px; }
.brand { flex: 0 0 100%; text-align: center; font-weight: 800; font-size: 1.15rem; line-height: 1.1; color: var(--gold); }
.brand span { color: var(--ink); }
.side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
.side.r { align-items: flex-end; }
.side span { color: var(--muted); font-size: 0.85rem; }
.side b { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.goal { background: var(--gold); color: var(--gold-ink); border-radius: 10px; padding: 2px 16px; text-align: center; line-height: 1.05; }
.goal b { display: block; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.goal span { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }

.stage { flex: 1 1 0; min-height: 0; overflow-y: auto; padding-inline: 16px; padding-block: 14px 8px; background: radial-gradient(ellipse at 50% 30%, var(--felt) 0%, var(--felt-deep) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
#slots { max-width: 460px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; }
.word { display: flex; gap: 3px; }
.word i { width: var(--b, 30px); height: var(--b, 30px); border-radius: 6px; background: var(--row); box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; font-size: calc(var(--b, 30px) * 0.62); }
.word i.on { background: var(--tile); color: var(--tile-ink); box-shadow: 0 2px 0 var(--tile-edge); }
.word i.hint { background: var(--tile); color: #8B6A1E; box-shadow: 0 2px 0 var(--tile-edge); }
.word.new i { animation: flip 0.35s ease-out both; }
.word.new i:nth-child(2) { animation-delay: 0.04s; } .word.new i:nth-child(3) { animation-delay: 0.08s; } .word.new i:nth-child(4) { animation-delay: 0.12s; } .word.new i:nth-child(5) { animation-delay: 0.16s; } .word.new i:nth-child(6) { animation-delay: 0.2s; } .word.new i:nth-child(7) { animation-delay: 0.24s; }
@keyframes flip { from { transform: rotateX(90deg); } }
#msg { min-height: 1.4em; text-align: center; font-weight: 800; color: var(--gold); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }

.rack { padding-inline: 16px; padding-block: 8px 12px; background: var(--wood); border-top: 6px solid var(--wood-deep); box-shadow: inset 0 10px 14px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#preview { min-height: 2.2rem; display: flex; gap: 3px; justify-content: center; align-items: center; }
#preview i { font-style: normal; font-weight: 800; font-size: 1.3rem; background: var(--gold); color: var(--gold-ink); border-radius: 6px; padding: 0 8px; }
.wheelrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; width: 100%; max-width: 440px; }
.side-tools { display: flex; flex-direction: column; gap: 8px; }
.side-tools.r { align-items: flex-end; }
.tool { min-height: 44px; min-width: 64px; border-radius: 10px; background: var(--bar); font-weight: 800; line-height: 1.05; padding: 4px 8px; }
.tool small { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 600; }
.tool.gold { background: var(--gold); color: var(--gold-ink); }
.tool.gold small { color: var(--gold-ink); }
.tool[hidden] { display: none; }
#wheel { position: relative; width: var(--wheel); height: var(--wheel); border-radius: 50%; background: rgba(0, 0, 0, 0.22); box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.35); touch-action: none; }
#wheel svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#wheel line, #wheel polyline { stroke: var(--gold); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.ltr { position: absolute; width: 22%; height: 22%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--tile); color: var(--tile-ink); box-shadow: 0 3px 0 var(--tile-edge); font-weight: 800; font-size: calc(var(--wheel) * 0.11); display: flex; align-items: center; justify-content: center; }
.ltr.on { background: var(--gold); color: var(--gold-ink); box-shadow: 0 3px 0 #A87700; }

.adbar { background: var(--bar); padding-inline: 16px; padding-block: 6px; }
.ad { width: min(320px, 100%); height: 50px; margin-inline: auto; display: flex; align-items: center; justify-content: center; border: 1px dashed #4C6A2C; border-radius: 6px; color: #8FA878; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.ad.live { border-color: transparent; color: transparent; }

.veil { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 20, 2, 0.78); }
.box { background: var(--bar); border: 3px solid var(--gold); border-radius: 14px; padding: 18px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.box h2 { margin: 0; font-size: 1.5rem; font-weight: 800; color: var(--gold); line-height: 1.1; text-wrap: balance; }
.box p { margin: 0; color: var(--muted); }
.go { background: var(--gold); color: var(--gold-ink); border-radius: 10px; min-height: 48px; font-weight: 800; font-size: 1.1rem; }
.go:disabled { opacity: 0.55; cursor: default; }
.adfake { height: 180px; border: 1px dashed #4C6A2C; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #8FA878; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .word.new i { animation: none; } }
</style>

<div class="bar">
  <div class="brand">Stack a Dollar <span>Words</span></div>
  <div class="side"><span>Found</span><b id="found">0/0</b></div>
  <div class="goal"><b id="level">1</b><span>Level</span></div>
  <div class="side r"><span>Bonus words</span><b id="bonus">0</b></div>
</div>
<div class="stage">
  <div id="slots" aria-label="Words to find"></div>
  <div id="msg" role="status" aria-live="polite">Swipe across the letters to spell a word</div>
</div>
<div class="rack">
  <div id="preview" aria-hidden="true"></div>
  <div class="wheelrow">
    <div class="side-tools">
      <button class="tool" id="shuffle">Shuffle</button>
      <button class="tool" id="clear" hidden>Clear</button>
    </div>
    <div id="wheel" aria-label="Letter wheel"><svg aria-hidden="true"><polyline id="line"></polyline><line id="tail"></line></svg></div>
    <div class="side-tools r">
      <button class="tool gold" id="hint">Hint<small>Watch an ad</small></button>
      <button class="tool" id="enter" hidden>Enter</button>
    </div>
  </div>
</div>
<div class="adbar"><div class="ad" id="adBanner">Ad space</div></div>

<div class="veil" id="won" hidden><div class="box">
  <h2 id="wonT">Level 1 done!</h2>
  <p id="wonP"></p>
  <button class="go" id="next">Next level</button>
</div></div>
<div class="veil" id="adBreak" hidden><div class="box">
  <p id="adLabel">Ad break</p>
  <div class="adfake">Ad shows here in the app</div>
  <button class="go" id="adGo" disabled>Continue</button>
</div></div>

  var v = $("adBreak"), b = $("adGo"), n = kind === "rewarded" ? 5 : 3; $("adLabel").textContent = kind === "rewarded" ? "Watch to reveal a letter" : "Ad break";
  v.hidden = false; b.disabled = true; b.textContent = "Continue in " + n;
  var iv = setInterval(function () { n--; if (n > 0) b.textContent = "Continue in " + n; else { clearInterval(iv); b.disabled = false; b.textContent = "Continue"; b.focus(); } }, 1000);
  b.onclick = function () { v.hidden = true; done(); };
}
if (post({ type: "banner", game: "words" })) $("adBanner").classList.add("live");

/* ---------- level ---------- */
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function load() {
  lv = LEVELS[(level - 1) % LEVELS.length];
  letters = shuffle(lv.l.split(""));
  words = lv.w.slice().sort(function (a, b) { return a.length - b.length || (a < b ? -1 : 1); });
  found = {}; reveal = {}; bonusFound = {}; chain = []; lastNew = "";
  $("won").hidden = true; say("Swipe across the letters to spell a word"); buildWheel(); render();
}
function submit() {
  var w = chain.map(function (i) { return letters[i]; }).join(""); chain = []; setTap(false);
  if (w.length < 3) { if (w.length) say("Words need 3 or more letters"); return render(); }
  if (words.indexOf(w) >= 0) {
    if (found[w]) say(w + " is already found");
    else { found[w] = true; lastNew = w; say(w + "!"); }
  } else if (lv.b.indexOf(w) >= 0) {
    if (bonusFound[w]) say(w + " is already counted");
    else { bonusFound[w] = true; bonusTotal++; try { localStorage.setItem("sad-words-bonus", bonusTotal); } catch (e) {} post({ type: "bonusWord", game: "words", word: w }); say("Bonus word: " + w + "!"); }
  } else say(w + " isn't in this puzzle");
  render();
  if (words.every(function (x) { return found[x]; })) win();
}
function win() {
  post({ type: "levelComplete", game: "words", level: level });
  $("wonT").textContent = "Level " + level + " done!";
  var nb = Object.keys(bonusFound).length;
  $("wonP").textContent = "You found all " + words.length + " words" + (nb ? " and " + nb + " bonus word" + (nb > 1 ? "s" : "") : "") + ".";
  level++; try { localStorage.setItem("sad-words-level", level); } catch (e) {}
  setTimeout(function () { $("won").hidden = false; $("next").focus(); }, 700);
}

/* ---------- drawing ---------- */
function say(s) { $("msg").textContent = s; }
function render() {
  var box = $("slots"), n = words.filter(function (w) { return found[w]; }).length, longest = words[words.length - 1].length;
  var b = Math.max(22, Math.min(34, Math.floor((Math.min(window.innerWidth, 460) - 40) / (longest * 2 + 2))));
  box.style.setProperty("--b", b + "px"); box.textContent = "";
  words.forEach(function (w) {
    var row = document.createElement("div"); row.className = "word" + (w === lastNew ? " new" : "");
    row.setAttribute("aria-label", found[w] ? w : w.length + " letter word" + (reveal[w] ? ", starts with " + w.slice(0, reveal[w]) : ""));
    w.split("").forEach(function (ch, k) {
      var i = document.createElement("i");
      if (found[w]) { i.className = "on"; i.textContent = ch; }
      else if (k < (reveal[w] || 0)) { i.className = "hint"; i.textContent = ch; }
      row.appendChild(i);
    });
    box.appendChild(row);
  });
  lastNew = "";
  $("found").textContent = n + "/" + words.length; $("level").textContent = level; $("bonus").textContent = bonusTotal;
  drawChain();
}
function buildWheel() {
  var wh = $("wheel"); Array.prototype.slice.call(wh.querySelectorAll(".ltr")).forEach(function (e) { e.remove(); });
  var n = letters.length, r = n > 6 ? 37 : 34;
  letters.forEach(function (ch, i) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / n, b = document.createElement("button");
    b.className = "ltr"; b.textContent = ch; b.dataset.i = i; b.style.left = (50 + r * Math.cos(a)) + "%"; b.style.top = (50 + r * Math.sin(a)) + "%";
    b.setAttribute("aria-label", "Letter " + ch);
    b.addEventListener("click", function (e) { if (e.detail === 0) tapLetter(i); });
    wh.appendChild(b);
  });
}
function center(i) { var el = $("wheel").querySelector('[data-i="' + i + '"]'), w = $("wheel").getBoundingClientRect(), r = el.getBoundingClientRect(); return [r.left + r.width / 2 - w.left, r.top + r.height / 2 - w.top]; }
function drawChain(px, py) {
  Array.prototype.forEach.call($("wheel").querySelectorAll(".ltr"), function (el) { el.classList.toggle("on", chain.indexOf(+el.dataset.i) >= 0); });
  $("line").setAttribute("points", chain.map(function (i) { return center(i).join(","); }).join(" "));
  var t = $("tail");
  if (drawing && chain.length && px !== undefined) { var c = center(chain[chain.length - 1]); t.setAttribute("x1", c[0]); t.setAttribute("y1", c[1]); t.setAttribute("x2", px); t.setAttribute("y2", py); t.style.display = ""; }
  else t.style.display = "none";
  var p = $("preview"); p.textContent = "";
  if (chain.length) { var i = document.createElement("i"); i.textContent = chain.map(function (k) { return letters[k]; }).join(""); p.appendChild(i); }
}
function setTap(on) { $("enter").hidden = !on; $("clear").hidden = !on; }
function tapLetter(i) { if (chain.indexOf(i) < 0) chain.push(i); setTap(true); drawChain(); }

/* ---------- swipe ---------- */
function letterAt(x, y) { var el = document.elementFromPoint(x, y); el = el && el.closest ? el.closest(".ltr") : null; return el ? +el.dataset.i : -1; }
var wh = $("wheel");
wh.addEventListener("pointerdown", function (e) {
  var i = letterAt(e.clientX, e.clientY); if (i < 0) return;
  e.preventDefault();
  if (chain.length && !$("enter").hidden) { tapLetter(i); return; }
  chain = [i]; drawing = true; moved = false;
  try { wh.setPointerCapture(e.pointerId); } catch (x) {}
  drawChain();
});
wh.addEventListener("pointermove", function (e) {
  if (!drawing) return;
  var i = letterAt(e.clientX, e.clientY);
  if (i >= 0 && chain.indexOf(i) < 0) { chain.push(i); moved = true; }
  else if (i >= 0 && chain.length > 1 && chain[chain.length - 2] === i) chain.pop();
  var w = wh.getBoundingClientRect(); drawChain(e.clientX - w.left, e.clientY - w.top);
});
function up() {
  if (!drawing) return; drawing = false;
  if (moved && chain.length > 1) submit(); else { setTap(true); drawChain(); say("Tap more letters, then Enter"); }
}
wh.addEventListener("pointerup", up); wh.addEventListener("pointercancel", up);

$("enter").addEventListener("click", submit);
$("clear").addEventListener("click", function () { chain = []; setTap(false); drawChain(); say(""); });
$("shuffle").addEventListener("click", function () { chain = []; setTap(false); letters = shuffle(letters); buildWheel(); drawChain(); });
$("hint").addEventListener("click", function () {
  var left = words.filter(function (w) { return !found[w]; }); if (!left.length) return;
  showAd("rewarded", function () {
    var w = left.sort(function (a, b) { return (reveal[a] || 0) / a.length - (reveal[b] || 0) / b.length; })[0];
    reveal[w] = (reveal[w] || 0) + 1;
    if (reveal[w] >= w.length) { found[w] = true; lastNew = w; }
    say("A letter is revealed"); render();
    if (words.every(function (x) { return found[x]; })) win();
  });
});
$("next").addEventListener("click", function () { $("won").hidden = true; if ((level - 1) % 2 === 0) showAd("interstitial", load); else load(); });
window.addEventListener("resize", function () { render(); });
load();
})();
</script>

</body>
