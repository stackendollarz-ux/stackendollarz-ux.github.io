<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.adbar{display:none!important}</style>
<script>
/* Website preview: no ads here, so ad breaks and "watch an ad" buttons continue right away. */
window.StackBridge = { postMessage: function (raw) {
  var m = {}; try { m = JSON.parse(raw); } catch (e) {}
  setTimeout(function () {
    if (m.type === "interstitial" && window.stackAdClosed) window.stackAdClosed();
    if (m.type === "rewarded" && window.stackRewardEarned) window.stackRewardEarned();
  }, 0);
} };
</script>
</head>
<body>
<title>Stack a Dollar Checkers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one screen. Score bar, a wooden-framed 8x8 board of felt and cream squares with gold coin pieces against dark ones, tools and ad banner space. Same family look as the other Stack a Dollar games; one dark look by choice. */
:root {
  color-scheme: dark;
  --felt: #5E9E1B; --felt-deep: #3F7A12; --bar: #17240C; --well: #24380F; --ink: #FFFFFF; --muted: #D8E8C4;
  --wood: #9A5A2E; --wood-deep: #6E3D1D; --gold: #F4B321; --gold-ink: #2A1B00;
  --p1: #F4B321; --p2: #39B8F2; --p3: #F2456B; --p4: #F28C28; --p5: #A77BF5; --p6: #2EC4A0;
  --card: #FBF8EE; --edge: #B9AE93; --black: #18140F; --red: #C4162E;
  --font: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--felt-deep); color: var(--ink); font-family: var(--font); font-size: 1rem; font-weight: 600; display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
button:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px; }
.bar { padding-inline: 16px; padding-block: 8px; background: var(--bar); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 10px; }
.brand { flex: 0 0 100%; text-align: center; font-weight: 800; font-size: 1.15rem; line-height: 1.1; color: var(--gold); }
.brand span { color: var(--ink); }
.side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
.side.r { align-items: flex-end; }
.side span { color: var(--muted); font-size: 0.85rem; }
.side b { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.goal { background: var(--gold); color: var(--gold-ink); border-radius: 10px; padding: 2px 16px; text-align: center; line-height: 1.05; }
.goal b { display: block; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.goal span { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
.new { border: 2px solid #4C6A2C; border-radius: 8px; min-height: 40px; padding: 0 10px; font-size: 0.9rem; }
.stage { position: relative; flex: 1 1 0; min-height: 0; padding-inline: 16px; padding-block: 12px 8px; background: radial-gradient(ellipse at 50% 40%, var(--felt) 0%, var(--felt-deep) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; }
#msg { min-height: 1.4em; text-align: center; font-weight: 800; color: var(--gold); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); max-width: 460px; }
.rack { padding-inline: 16px; padding-block: 10px 12px; background: var(--wood); border-top: 6px solid var(--wood-deep); box-shadow: inset 0 10px 14px rgba(0, 0, 0, 0.25); }
.tools { max-width: 440px; margin-inline: auto; display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 8px; }
.tool { min-height: 48px; border-radius: 10px; background: var(--bar); font-weight: 800; line-height: 1.1; padding: 4px; }
.tool small { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.tool.gold { background: var(--gold); color: var(--gold-ink); }
.tool.gold small { color: var(--gold-ink); }
.tool:disabled { opacity: 0.45; cursor: default; }
.adbar { background: var(--bar); padding-inline: 16px; padding-block: 6px; }
.ad { width: min(320px, 100%); height: 50px; margin-inline: auto; display: flex; align-items: center; justify-content: center; border: 1px dashed #4C6A2C; border-radius: 6px; color: #8FA878; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.ad.live { border-color: transparent; color: transparent; }
.veil { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 20, 2, 0.78); }
.box { background: var(--bar); border: 3px solid var(--gold); border-radius: 14px; padding: 18px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.box h2 { margin: 0; font-size: 1.5rem; font-weight: 800; color: var(--gold); line-height: 1.1; text-wrap: balance; }
.box p { margin: 0; color: var(--muted); }
.box .big { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.go { background: var(--gold); color: var(--gold-ink); border-radius: 10px; min-height: 48px; font-weight: 800; font-size: 1.1rem; }
.go.alt { background: transparent; color: var(--ink); border: 2px solid #4C6A2C; }
.go:disabled { opacity: 0.55; cursor: default; }
.adfake { height: 180px; border: 1px dashed #4C6A2C; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #8FA878; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.85rem; }

#board { width: min(100%, 440px, calc(100dvh - 330px)); min-width: 240px; aspect-ratio: 1; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border: 8px solid var(--wood-deep); border-radius: 10px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); }
.sq { position: relative; display: flex; align-items: center; justify-content: center; }
.sq.l { background: #E8DFC2; }
.sq.d { background: #3B6E17; }
.sq.from { background: #5E8F2A; }
.sq.to::after { content: ""; width: 30%; height: 30%; border-radius: 50%; background: var(--gold); opacity: 0.85; }
.sq.lastm { box-shadow: inset 0 0 0 3px rgba(244, 179, 33, 0.6); }
.pc { width: 78%; height: 78%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; line-height: 1; font-size: calc(min(440px, 100vw) / 8 * 0.36); }
.pc.me { background: var(--gold); color: var(--gold-ink); box-shadow: inset 0 -4px 0 #A87700, inset 0 0 0 4px #FFD666, 0 3px 4px rgba(0, 0, 0, 0.45); }
.pc.ai { background: #2A1F18; color: #E8DFC2; box-shadow: inset 0 -4px 0 #0E0905, inset 0 0 0 4px #4A3829, 0 3px 4px rgba(0, 0, 0, 0.45); }
.pc.sel { outline: 3px solid #FFFFFF; outline-offset: 2px; }
.pc.can { animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: inset 0 -4px 0 #A87700, inset 0 0 0 4px #FFD666, 0 0 0 4px rgba(255, 255, 255, 0.5); } }
@media (prefers-reduced-motion: reduce) { .pc.can { animation: none; } }
</style>

<div class="bar">
  <div class="brand">Stack a Dollar <span>Checkers</span></div>
  <div class="side"><span>You</span><b id="mine">12</b></div>
  <div class="goal"><b id="wins">0</b><span>Wins</span></div>
  <div class="side r"><span>Computer</span><b id="theirs">12</b></div>
  <button class="new" id="newGame">New game</button>
</div>
<div class="stage">
  <div id="board" role="grid" aria-label="Checkers board"></div>
  <div id="msg" role="status" aria-live="polite">Your move. You play gold, moving up.</div>
</div>
<div class="rack"><div class="tools" style="--n: 2">
  <button class="tool" id="undo">Undo</button>
  <button class="tool" id="level">Level: Easy</button>
</div></div>
<div class="adbar"><div class="ad" id="adBanner">Ad space</div></div>
<div class="veil" id="adBreak" hidden><div class="box">
  <p id="adLabel">Ad break</p>
  <div class="adfake">Ad shows here in the app</div>
  <button class="go" id="adGo" disabled>Continue</button>
</div></div>
<div class="veil" id="over" hidden><div class="box">
  <h2 id="overT">You win!</h2>
  <p id="overP"></p>
  <button class="go" id="again">Play again</button>
</div></div>

<script>
(function () {
"use strict";
var $ = function (id) { return document.getElementById(id); }, GAME = "checkers";
/* ---------- app bridge: the phone app connects these to AdMob and rewards ---------- */
function post(o) { o.game = GAME; try { if (window.StackBridge && window.StackBridge.postMessage) { window.StackBridge.postMessage(JSON.stringify(o)); return true; } } catch (e) {} return false; }
function showAd(kind, label, done) {
  if (post({ type: kind })) { window[kind === "rewarded" ? "stackRewardEarned" : "stackAdClosed"] = function () { done(); }; return; }
  var v = $("adBreak"), b = $("adGo"), n = kind === "rewarded" ? 5 : 3; $("adLabel").textContent = label || "Ad break";
  v.hidden = false; b.disabled = true; b.textContent = "Continue in " + n;
  var iv = setInterval(function () { n--; if (n > 0) b.textContent = "Continue in " + n; else { clearInterval(iv); b.disabled = false; b.textContent = "Continue"; b.focus(); } }, 1000);
  b.onclick = function () { v.hidden = true; done(); };
}
if (post({ type: "banner" })) $("adBanner").classList.add("live");
function store(k, v) { try { if (v === undefined) return localStorage.getItem("sad-" + GAME + "-" + k); localStorage.setItem("sad-" + GAME + "-" + k, v); } catch (e) { return null; } }

var LEVELS = [["Easy", 2], ["Medium", 4], ["Hard", 6]], lvl = +store("lvl") || 0;
var bd, turn, sel = -1, legal = [], hist = [], quiet = 0, lastMove = null, wins = +store("wins") || 0, thinking = false, done = false;

function rc(i) { return [i >> 3, i & 7]; }
function idx(r, c) { return r * 8 + c; }
function setup() {
  bd = new Array(64).fill(0);
  for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) if ((r + c) % 2) { if (r < 3) bd[idx(r, c)] = -1; else if (r > 4) bd[idx(r, c)] = 1; }
  turn = 1; sel = -1; hist = []; quiet = 0; lastMove = null; done = false; thinking = false;
  $("over").hidden = true; say("Your move. You play gold, moving up."); refresh();
}
function dirs(p) { var k = Math.abs(p) === 2; if (k) return [[-1, -1], [-1, 1], [1, -1], [1, 1]]; return p > 0 ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]; }
function jumps(b, i, p, path, caps, out) {
  var found = false, r = i >> 3, c = i & 7;
  dirs(p).forEach(function (d) {
    var mr = r + d[0], mc = c + d[1], tr = r + 2 * d[0], tc = c + 2 * d[1];
    if (tr < 0 || tr > 7 || tc < 0 || tc > 7) return;
    var m = idx(mr, mc), t = idx(tr, tc);
    if (b[m] && Math.sign(b[m]) !== Math.sign(p) && caps.indexOf(m) < 0 && !b[t]) {
      found = true;
      var crown = Math.abs(p) === 1 && ((p > 0 && tr === 0) || (p < 0 && tr === 7));
      var b2 = b.slice(); b2[t] = p; b2[i] = 0;
      if (crown) out.push({ path: path.concat(t), caps: caps.concat(m) });
      else jumps(b2, t, p, path.concat(t), caps.concat(m), out);
    }
  });
  if (!found && caps.length) out.push({ path: path, caps: caps });
}
function moves(b, side) {
  var caps = [], plain = [];
  for (var i = 0; i < 64; i++) {
    var p = b[i]; if (!p || Math.sign(p) !== side) continue;
    var out = []; jumps(b, i, p, [i], [], out); caps = caps.concat(out);
    if (!caps.length) dirs(p).forEach(function (d) { var r = (i >> 3) + d[0], c = (i & 7) + d[1]; if (r >= 0 && r < 8 && c >= 0 && c < 8 && !b[idx(r, c)]) plain.push({ path: [i, idx(r, c)], caps: [] }); });
  }
  return caps.length ? caps : plain;
}
function apply(b, m) {
  var b2 = b.slice(), from = m.path[0], to = m.path[m.path.length - 1], p = b2[from];
  b2[from] = 0; m.caps.forEach(function (x) { b2[x] = 0; });
  var r = to >> 3; if (p === 1 && r === 0) p = 2; if (p === -1 && r === 7) p = -2;
  b2[to] = p; return b2;
}
function evalB(b) { var s = 0; for (var i = 0; i < 64; i++) { var p = b[i]; if (!p) continue; var v = Math.abs(p) === 2 ? 165 : 100; if (Math.abs(p) === 1) v += (p > 0 ? 7 - (i >> 3) : (i >> 3)) * 3; var c = i & 7; if (c > 1 && c < 6) v += 2; s += p > 0 ? -v : v; } return s; }
function search(b, depth, side, a, z) {
  var ms = moves(b, side);
  if (!ms.length) return side === -1 ? -10000 - depth : 10000 + depth;
  if (depth === 0) return evalB(b);
  if (side === -1) { var best = -1e9; for (var i = 0; i < ms.length; i++) { best = Math.max(best, search(apply(b, ms[i]), depth - 1, 1, a, z)); a = Math.max(a, best); if (a >= z) break; } return best; }
  var worst = 1e9; for (i = 0; i < ms.length; i++) { worst = Math.min(worst, search(apply(b, ms[i]), depth - 1, -1, a, z)); z = Math.min(z, worst); if (a >= z) break; } return worst;
}
function aiMove() {
  var ms = moves(bd, -1); if (!ms.length) return end(1);
  var depth = LEVELS[lvl][1], best = null, bv = -1e9;
  ms.sort(function () { return Math.random() - 0.5; }).forEach(function (m) { var v = search(apply(bd, m), depth - 1, 1, -1e9, 1e9); if (v > bv) { bv = v; best = m; } });
  doMove(best);
}
function doMove(m) {
  bd = apply(bd, m); quiet = m.caps.length ? 0 : quiet + 1; lastMove = m; turn = -turn; sel = -1;
  if (quiet >= 80) return end(0);
  refresh();
  var ms = moves(bd, turn);
  if (!ms.length) return end(-turn);
  if (turn === -1) { thinking = true; say("Computer is thinking..."); setTimeout(function () { thinking = false; aiMove(); }, 450); }
  else say(ms[0].caps.length ? "You must jump!" : "Your move.");
}
function end(w) {
  done = true; refresh();
  if (w === 1) { wins++; store("wins", wins); }
  post({ type: "gameOver", won: w === 1, draw: w === 0, level: LEVELS[lvl][0] });
  $("overT").textContent = w === 1 ? "You win!" : w === 0 ? "It's a draw" : "Computer wins";
  $("overP").textContent = w === 1 ? "Nice game. Try a harder level." : "Give it another shot.";
  setTimeout(function () { $("over").hidden = false; $("again").focus(); }, 500);
}
function tap(i) {
  if (turn !== 1 || thinking || done) return;
  var mine = moves(bd, 1);
  if (bd[i] > 0) { sel = mine.some(function (m) { return m.path[0] === i; }) ? i : -1; if (sel < 0) say(mine[0] && mine[0].caps.length ? "You must jump with another piece" : "That piece can't move"); refresh(); return; }
  if (sel < 0) return;
  var m = mine.filter(function (x) { return x.path[0] === sel && x.path[x.path.length - 1] === i; })[0];
  if (!m) return;
  hist.push(JSON.stringify({ bd: bd, quiet: quiet }));
  doMove(m);
}

function say(s) { $("msg").textContent = s; }
function refresh() {
  var g = $("board"); g.textContent = "";
  var mine = turn === 1 && !done ? moves(bd, 1) : [], dests = mine.filter(function (m) { return m.path[0] === sel; }).map(function (m) { return m.path[m.path.length - 1]; });
  var movers = mine.map(function (m) { return m.path[0]; });
  for (var i = 0; i < 64; i++) (function (i) {
    var r = i >> 3, c = i & 7, dark = (r + c) % 2 === 1, el = document.createElement(dark ? "button" : "div");
    el.className = "sq " + (dark ? "d" : "l") + (i === sel ? " from" : "") + (dests.indexOf(i) >= 0 ? " to" : "") + (lastMove && lastMove.path.indexOf(i) >= 0 ? " lastm" : "");
    el.setAttribute("role", "gridcell");
    var p = bd[i];
    if (p) { var pc = document.createElement("span"); pc.className = "pc " + (p > 0 ? "me" : "ai") + (i === sel ? " sel" : "") + (p > 0 && sel < 0 && mine.length && mine[0].caps.length && movers.indexOf(i) >= 0 ? " can" : ""); pc.textContent = Math.abs(p) === 2 ? "$" : ""; el.appendChild(pc); }
    if (dark) { el.setAttribute("aria-label", "Row " + (8 - r) + " column " + (c + 1) + (p ? (p > 0 ? ", your " : ", computer ") + (Math.abs(p) === 2 ? "king" : "piece") : dests.indexOf(i) >= 0 ? ", move here" : "")); el.addEventListener("click", function () { tap(i); }); }
    g.appendChild(el);
  })(i);
  var a = 0, b = 0; bd.forEach(function (p) { if (p > 0) a++; else if (p < 0) b++; });
  $("mine").textContent = a; $("theirs").textContent = b; $("wins").textContent = wins;
  $("undo").disabled = !hist.length || turn !== 1 || done; $("level").textContent = "Level: " + LEVELS[lvl][0];
}

$("undo").addEventListener("click", function () { if (!hist.length || turn !== 1) return; var h = JSON.parse(hist.pop()); bd = h.bd; quiet = h.quiet; sel = -1; lastMove = null; say("Your move."); refresh(); });
$("level").addEventListener("click", function () { lvl = (lvl + 1) % LEVELS.length; store("lvl", lvl); refresh(); say("Level set to " + LEVELS[lvl][0] + ". It applies right away."); });
$("newGame").addEventListener("click", setup);
$("again").addEventListener("click", function () { $("over").hidden = true; showAd("interstitial", "", setup); });
setup();
})();
</script>

</body>
</html>
